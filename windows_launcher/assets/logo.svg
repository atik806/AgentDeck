<svg xmlns="http://www.w3.org/2000/svg" width="620" height="160" viewBox="0 0 620 160" role="img" aria-label="AgentDeck">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#161622"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a3d"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#89dceb"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2a40"/>
      <stop offset="1" stop-color="#1d1d2d"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="159" rx="28" fill="url(#card)"
        stroke="#313244" stroke-width="1"/>

  <!-- mark -->
  <g transform="translate(30,26) scale(0.44)">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25"
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
    <rect x="94" y="44" width="104" height="150" rx="16" fill="#232338" stroke="#3c3c55" stroke-width="2.5"/>
    <rect x="77" y="55" width="104" height="150" rx="16" fill="#262640" stroke="#484868" stroke-width="2.5"/>
    <rect x="60" y="66" width="104" height="150" rx="16" fill="url(#front)" stroke="#585880" stroke-width="3"/>
    <polyline points="82,106 108,132 82,158" fill="none" stroke="url(#prompt)"
              stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="118" y="120" width="30" height="24" rx="5" fill="#a6e3a1"/>
    <g fill="#45475a">
      <rect x="82" y="178" width="58" height="8" rx="4"/>
      <rect x="82" y="194" width="38" height="8" rx="4"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif">
    <text x="168" y="82" font-size="46" font-weight="700" letter-spacing="0.5">
      <tspan fill="#cdd6f4">Agent</tspan><tspan fill="#89b4fa">Deck</tspan>
    </text>
    <text x="170" y="116" font-size="15" font-weight="600" fill="#7f849c"
          letter-spacing="4.5">EVERY TERMINAL · EVERY AGENT</text>
  </g>
</svg>
