<svg xmlns="http://www.w3.org/2000/svg" width="560" height="160" viewBox="0 0 560 160" role="img" aria-label="Multi-Terminal Panel">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#161622"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a3d"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#89dceb"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="559" height="159" rx="28" fill="url(#card)"
        stroke="#313244" stroke-width="1"/>

  <!-- mark -->
  <g transform="translate(32,20) scale(0.5)">
    <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
    <rect x="8.75" y="8.75" width="238.5" height="238.5" rx="51.25"
          fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
    <rect x="40" y="48" width="176" height="160" rx="20" fill="#11111b"/>
    <rect x="41" y="49" width="174" height="158" rx="19" fill="none" stroke="#313244" stroke-width="2"/>
    <rect x="52" y="60" width="96" height="136" rx="9" fill="#1e1e2e"/>
    <rect x="156" y="60" width="48" height="64" rx="9" fill="#1e1e2e"/>
    <rect x="156" y="132" width="48" height="64" rx="9" fill="#1e1e2e"/>
    <polyline points="70,94 90,114 70,134" fill="none" stroke="url(#prompt)"
              stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="100" y="106" width="28" height="16" rx="3" fill="#a6e3a1"/>
    <g fill="#45475a">
      <rect x="166" y="78"  width="28" height="6" rx="3"/>
      <rect x="166" y="92"  width="20" height="6" rx="3"/>
      <rect x="166" y="150" width="28" height="6" rx="3"/>
      <rect x="166" y="164" width="16" height="6" rx="3"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif">
    <text x="168" y="82" font-size="40" font-weight="700" fill="#cdd6f4"
          letter-spacing="0.5">Multi-Terminal</text>
    <text x="169" y="118" font-size="22" font-weight="500" fill="#89b4fa"
          letter-spacing="9.5">PANEL</text>
  </g>
</svg>
