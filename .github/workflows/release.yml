name: release

# Push a tag like v0.1.1 (after bumping windows_launcher/version.py) to build
# the Windows app and publish it to GitHub Releases.
#
# Pick ONE release path -- don't do both for the same version:
#   * CI:    bump version.py, commit, then `git tag vX.Y.Z && git push origin vX.Y.Z`
#   * local: `packaging/build.py` then `vpk upload github ...` (this also
#            creates the tag, which fires this workflow -- the "already
#            published" guard below then no-ops the publish step)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # create the GitHub release + upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Check the tag matches version.py
        shell: pwsh
        run: |
          $v = (Select-String -Path windows_launcher/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { throw "version.py ($v) != tag ($tag)" }

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r windows_launcher/requirements.txt
          pip install ./voice_capture
          pip install -r windows_launcher/requirements-build.txt

      - name: Build + pack
        run: python packaging/build.py

      # If this tag already has a published, non-draft release with assets
      # (e.g. it was published locally with `vpk upload`, which creates the
      # tag), there's nothing to do -- skip the publish step instead of failing.
      - name: Is the release already published?
        id: check
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $h = @{ Authorization = "token $env:GITHUB_TOKEN"; "User-Agent" = "ci" }
          $tag = "${{ github.ref_name }}"
          try {
            $r = Invoke-RestMethod -Headers $h `
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
            $done = (-not $r.draft) -and (@($r.assets).Count -gt 0)
          } catch { $done = $false }
          $flag = if ($done) { 'true' } else { 'false' }
          "already=$flag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "already published: $flag"

      - name: Publish to GitHub Releases
        if: steps.check.outputs.already != 'true'
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --outputDir packaging/Releases
          --publish true
          --releaseName "AgentDeck ${{ github.ref_name }}"
          --tag ${{ github.ref_name }}
