name: release

# Push a tag like v0.1.1 (after bumping windows_launcher/version.py) to build
# the Windows app and publish it to GitHub Releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write        # create the GitHub release + upload assets

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Check the tag matches version.py
        shell: pwsh
        run: |
          $v = (Select-String -Path windows_launcher/version.py -Pattern '__version__\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($v -ne $tag) { throw "version.py ($v) != tag ($tag)" }

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r windows_launcher/requirements.txt
          pip install ./voice_capture
          pip install -r windows_launcher/requirements-build.txt

      - name: Build + pack
        run: python packaging/build.py

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          vpk upload github
          --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --publish
          --releaseName "AgentDeck ${{ github.ref_name }}"
          --tag ${{ github.ref_name }}
