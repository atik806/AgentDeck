name: linux-ci

# Linux port CI. Two independent jobs:
#   * test          -- runs the existing pytest suite against windows_launcher/ on
#                       ubuntu-latest, the only place Linux-side code in this repo can
#                       actually be exercised (dev machine is Windows-only, no WSL2).
#   * velopack-spike -- manual-dispatch only. Verifies Velopack's Linux/AppImage output
#                       before the real packaging pipeline (see linux-v4/) is built on
#                       top of it. See linux-v4/context.md for the spike's findings.
#
# Separate from .github/workflows/release.yml, which stays Windows-only and
# tag-triggered.

on:
  push:
    branches: ["**"]
    paths:
      - "windows_launcher/**"
      - ".github/workflows/linux-ci.yml"
  pull_request:
    paths:
      - "windows_launcher/**"
      - ".github/workflows/linux-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # A manual dispatch is normally for re-running the spike (below) in
    # isolation; without this guard it would also re-run the full suite for
    # no reason, doubling CI minutes on every spike re-run.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      # Qt6/xcb runtime libraries the PySide6 wheel does not vendor, plus a real
      # (if ephemeral) Secret Service provider: test_github_auth.py /
      # test_supabase_auth.py's existing token/session round-trip checks call
      # secret_store.EncryptedJsonStore for real (no mocking) -- on Linux that's
      # a genuine keyring.set_password/get_password call (see secret_store.py),
      # so without a keyring daemon those two files would fail here not because
      # of a bug but because the CI environment has nothing to store the secret
      # in. gnome-keyring + dbus-x11 give it one.
      #
      # libxkbcommon-x11-0 (distinct from libxkbcommon0) is required by Qt's
      # xcb platform plugin but not obvious from Qt's own error text -- a
      # first CI run without it failed with "xcb-cursor0 or libxcb-cursor0 is
      # needed" even with libxcb-cursor0 already installed; that message names
      # the most common culprit generically and isn't reliable diagnostics.
      - name: Install Qt/X11 runtime libraries + keyring backend
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-sync1 libx11-xcb1 libdbus-1-3 xvfb fluxbox x11-utils \
            gnome-keyring dbus-x11

      # gnome-keyring's default "login" collection doesn't exist yet on a
      # fresh runner, and `gnome-keyring-daemon --unlock` unlocks an
      # *existing* locked keyring -- it doesn't create one, so the first
      # `keyring.set_password()` call falls through to gnome-keyring's
      # interactive creation/unlock flow (the "SystemPrompter" GTK dialog),
      # which then fails outright since there's no real display for it (a
      # first CI run confirmed exactly this: "cannot open display", the
      # secret never gets stored). Pre-seeding an explicitly UNENCRYPTED
      # collection (a [keyring] section with no hash-algo/salt -- gnome-
      # keyring's own on-disk marker for "not password-protected") sidesteps
      # the prompt entirely: there's nothing to unlock, so nothing needs
      # confirming.
      - name: Pre-seed an unlocked (unencrypted) default keyring collection
        run: |
          mkdir -p ~/.local/share/keyrings
          cat > ~/.local/share/keyrings/login.keyring <<'EOF'
          [keyring]
          display-name=Login
          ctime=0
          mtime=0
          lock-on-idle=false
          lock-after=false
          EOF
          echo -n "login" > ~/.local/share/keyrings/default

      - name: Install dependencies
        run: |
          python -m pip install "pip==24.3.1"
          pip install -c windows_launcher/constraints.txt -r windows_launcher/requirements.txt

      # This project's tests are standalone scripts, not pytest-collectible: each
      # test_*.py prints PASS/FAIL per check and does `sys.exit(1 if fails else 0)`
      # at module scope (see windows_launcher/README.md's "Testing" section, which
      # documents running each one as `python test_X.py`). Reproduce that here
      # rather than `pytest windows_launcher` -- pytest importing a module that
      # calls sys.exit() at import time does not report results the way this
      # convention expects.
      #
      # One shared Xvfb + fluxbox for the whole run, not `xvfb-run` per file:
      # test_panel.py's real-window checks (documented as needing "a real
      # window server... with no other GUI process alongside" even on
      # Windows) depend on the window actually becoming the *WM-activated*
      # window -- Qt's hasFocus()/window-activation semantics are gated on
      # that, and a bare Xvfb has no window manager to grant it at all. A
      # first CI run confirmed this exactly: canvas.setFocus() was called,
      # but hasFocus() still read False. fluxbox (lightweight, common in
      # headless-Qt-testing CI setups for this exact reason) gives windows
      # something to be activated by. A generous 1920x1080 screen avoids a
      # default Xvfb resolution clipping/resizing a test window and skewing
      # geometry checks.
      #
      # dbus-run-session + gnome-keyring-daemon --unlock: a bare CI runner has no
      # logged-in desktop session (no D-Bus session bus, no auto-unlocked login
      # keyring), so this starts both by hand -- an empty-password "login" that
      # gnome-keyring accepts as the unlock, matching the well-known headless-
      # testing pattern for apps built on the Secret Service API. Confirmed
      # working in this workflow's first real run (alongside the pre-seeded
      # unencrypted keyring collection above) -- see linux-v4/context.md Phase 3.
      - name: Run tests
        working-directory: windows_launcher
        run: |
          dbus-run-session -- bash -c '
            Xvfb :99 -screen 0 1920x1080x24 &
            XVFB_PID=$!
            export DISPLAY=:99
            for i in $(seq 1 20); do
              xdpyinfo -display :99 >/dev/null 2>&1 && break
              sleep 0.25
            done
            fluxbox >/tmp/fluxbox.log 2>&1 &
            FLUXBOX_PID=$!
            sleep 1

            eval "$(printf "" | gnome-keyring-daemon --unlock --daemonize --components=secrets)"
            export GNOME_KEYRING_CONTROL

            fail=0
            for f in test_*.py; do
              echo "=== $f ==="
              if ! python "$f"; then
                echo "::error::$f failed"
                fail=1
              fi
            done

            kill "$FLUXBOX_PID" "$XVFB_PID" 2>/dev/null || true
            exit $fail
          '

  velopack-spike:
    # Manual only -- this doesn't gate every push, it's a one-off verification step
    # for Phase 0 of the Linux port. Re-run by hand from the Actions tab when the
    # spike's findings need refreshing (e.g. after a `vpk`/`velopack` version bump).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: "8.0.x"

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Qt/X11 runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libdbus-1-3 xvfb

      - name: vpk --help (confirm Linux flags exist)
        run: vpk pack --help

      - name: Build a throwaway PySide6 hello-world onedir app
        run: |
          python -m pip install "pip==24.3.1" pyinstaller "PySide6>=6.11,<7.0"
          mkdir -p /tmp/spike
          cat > /tmp/spike/hello.py <<'PY'
          import sys
          from PySide6.QtWidgets import QApplication, QLabel

          app = QApplication(sys.argv)
          label = QLabel("AgentDeck Linux spike")
          label.show()
          # Exit immediately in CI -- this only needs to prove the window opens.
          from PySide6.QtCore import QTimer
          QTimer.singleShot(500, app.quit)
          sys.exit(app.exec())
          PY
          pyinstaller --onedir --windowed --name hello --distpath /tmp/spike/dist \
            --workpath /tmp/spike/build /tmp/spike/hello.py

      - name: vpk pack (Linux channel)
        run: |
          mkdir -p /tmp/spike/releases
          vpk pack --packId AgentDeckSpike --packVersion 0.0.1 \
            --packDir /tmp/spike/dist/hello --mainExe hello \
            --packTitle "AgentDeck Spike" --channel linux \
            --outputDir /tmp/spike/releases
          ls -la /tmp/spike/releases

      - name: Smoke-run the AppImage
        run: |
          APPIMAGE=$(find /tmp/spike/releases -iname '*.AppImage' | head -n1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::no .AppImage produced by vpk pack"
            exit 1
          fi
          chmod +x "$APPIMAGE"
          xvfb-run -a "$APPIMAGE" --appimage-extract-and-run &
          PID=$!
          sleep 3
          kill "$PID" 2>/dev/null || true
          echo "AppImage launched: $APPIMAGE"
