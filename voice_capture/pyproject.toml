[build-system]
requires = ["setuptools>=68,<72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-capture"
version = "0.1.0"
description = "A Python desktop voice-to-text application using whisper.cpp and PySide6"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10,<3.15"
dependencies = [
    "pyside6>=6.11,<6.12",
    "sounddevice>=0.5.5,<0.6",
    "pywhispercpp>=1.5.0,<2.0",
    "webrtcvad-wheels>=2.0.14,<3.0",
    "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
audio-io = ["soundfile>=0.12,<1.0"]
signal = ["scipy>=1.12,<2.0"]
silero-vad = ["silero-vad>=6.2,<7.0", "torch>=2.2,<3.0", "torchaudio>=2.2,<3.0"]
all = [
    "soundfile>=0.12,<1.0",
    "scipy>=1.12,<2.0",
    "silero-vad>=6.2,<7.0",
    "torch>=2.2,<3.0",
    "torchaudio>=2.2,<3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.2",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.urls]
Homepage = "https://github.com/yourusername/voice-capture"
Repository = "https://github.com/yourusername/voice-capture"
Documentation = "https://github.com/yourusername/voice-capture#readme"

[tool.setuptools.packages.find]
include = ["voice_capture*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
